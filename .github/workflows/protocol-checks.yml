name: Protocol checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check data protocol and artifact inference
        run: python test_protocol.py --out checks/regression
      - name: Exercise all methods and both stages on synthetic images
        run: >-
          python run_experiments.py --manifest checks/regression/manifest.csv
          --data-root checks/regression --out checks/integration --budgets 2
          --seeds 42 --steps 2 --val-every 1 --bootstrap 20 --image-size 32
          --threads 2 --random-init
      - name: Check the Streamlit app with the generated artifacts
        run: >-
          python test_protocol.py --out checks/app
          --app-run checks/integration/protonet_k2_seed42
